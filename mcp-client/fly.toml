app = "agent-core-client"
primary_region = "iad"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3100"
  DEFAULT_MODEL = "groq:openai/gpt-oss-20b"
  MAX_TOOL_ROUNDS = "10"

[http_service]
  internal_port = 3100
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
